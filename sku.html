<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css"/>
     <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
     <title>Sku Generator</title>
</head>
<body style="background-color: rgb(220, 180, 245); margin: 0; padding-bottom: 60px">

     <!-- NAVBAR -->
     <nav class="navbar navbar-fixed-top" style="background-color: rgb(76, 52, 94)">
          <div class="container-fluid">
               <div class="navbar-header">
                    <b><a class="navbar-brand" href="./index.html" style="color: white;">Radiant Brew</a></b>
               </div>
               <ul class="nav navbar-nav">
                    <li><a href="./index.html" style="text-decoration: none; color: white;">Receipt Generator</a></li>
                    <li><a href="./sku.html" style="text-decoration: none; color: white;">SKU Generator</a></li>
               </ul>
          </div>
     </nav>

     <!-- TITLE -->
     <h1 style="text-align: center; margin-top: 20px;">SKU Generator</h1>

     <!-- SKU GENERATOR -->
     <div style="margin: 20px; border: 2px solid black; border-radius: 20px; padding: 20px; background-color: white;">

          <!-- CATEGORY -->
          <b><label for="Cat" style="margin-bottom: 5px;">Category</label></b><br>
          <select name="category" id="Cat" style="width: 100%;" class="form-control">
               <option value="perishables">Perishables</option>
               <option value="non-perishables">Non-Perishables</option>
               <option value="pastries">Pastries</option>
               <option value="beverages">Beverages</option>
          </select><br>

          <!-- PRODUCT NAME -->
          <b><label for="prod-name" style="margin-bottom: 5px">Product Name</label></b><br>
          <select name="product-name" id="prod-name" style="width: 100%;" class="form-control">
               <option value="iced-coffee">Iced Coffee</option>
               <option value="latte">Latte</option>
               <option value="matcha">Matcha</option>
               <option value="chocolate-mousse">Chocolate Mousse</option>
               <option value="caramel-macchiato">Caramel Macchiato</option>
               <option value="bottled-water">Bottled Water</option>
               <option value="chocolate-cake">Chocolate Cake</option>
          </select><br>

          <!-- STOCK QUANTITY -->
          <b><label for="stock-quan" style="margin-bottom: 5px">Stock Quantity</label></b><br>
               <input type="number" id="stoc-quan" class="form-control" placeholder="e.g. 50"><br>

          <!-- BUTTON -->
          <div style="text-align: center;">
               <button py-click="calc_sku" class="btn btn-info">Generate SKU</button>
          </div>
          <hr>

          <div id="sku" style="text-align: center;"></div>

     </div>

     <!-- FOOTER -->
     <div class="footer" style="position: fixed; left: 0; bottom: 0; width: 100%; background-color: rgb(76, 52, 94); color: white; text-align: center; margin: 0">
          <p style="margin: 0; padding: 10px; font-size: 15px;">&copy; 2026 Radiant Brew</p>
     </div>

     <py-script src="main.py"></py-script>
</body>
</html>
